<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(2deg); }
      50% { transform: translateY(-16px) rotate(-1.5deg); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes cursorMove {
      0%, 100% { transform: translate(780px, 140px); }
      25% { transform: translate(890px, 190px); }
      50% { transform: translate(960px, 120px); }
      75% { transform: translate(840px, 240px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .floating-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .floating-card-3 { animation: floatCard3 5.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 6, 6; animation: dashFlow 2s linear infinite; }
    .animated-cursor { animation: cursorMove 12s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="280" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="380" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Whiteboard Dot Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#dotGrid)" />

  <!-- Dynamic Whiteboard Canvas Diagram Elements (Right / Decorative Layer) -->
  <g opacity="0.9">
    <!-- Connecting flow arrows -->
    <path class="flow-line" d="M 760 160 C 830 130, 870 190, 930 170" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <path class="flow-line" d="M 870 230 C 920 270, 980 240, 1020 210" fill="none" stroke="#f472b6" stroke-width="2" />

    <!-- Canvas Card 1: Sticky Note (Brainstorm) -->
    <g class="floating-card-1">
      <rect x="730" y="80" width="130" height="110" rx="8" fill="#fef08a" opacity="0.92" filter="url(#softGlow)" />
      <rect x="745" y="100" width="70" height="8" rx="4" fill="#ca8a04" opacity="0.6" />
      <rect x="745" y="118" width="95" height="6" rx="3" fill="#ca8a04" opacity="0.4" />
      <rect x="745" y="132" width="80" height="6" rx="3" fill="#ca8a04" opacity="0.4" />
      <circle cx="835" cy="95" r="4" fill="#eab308" />
    </g>

    <!-- Canvas Card 2: Technical Diagram Wireframe -->
    <g class="floating-card-2">
      <rect x="910" y="110" width="180" height="125" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <rect x="925" y="125" width="150" height="24" rx="4" fill="#334155" />
      <circle cx="937" cy="137" r="4" fill="#ef4444" />
      <circle cx="949" cy="137" r="4" fill="#eab308" />
      <circle cx="961" cy="137" r="4" fill="#22c55e" />
      <!-- Canvas UI elements -->
      <rect x="925" y="160" width="60" height="60" rx="6" fill="#0ea5e9" opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="1000" y="165" width="75" height="10" rx="3" fill="#64748b" />
      <rect x="1000" y="185" width="55" height="8" rx="3" fill="#64748b" opacity="0.7" />
      <circle cx="955" cy="190" r="14" fill="#38bdf8" opacity="0.5" />
    </g>

    <!-- Canvas Card 3: Creative Moodboard / Color Swatch -->
    <g class="floating-card-3">
      <rect x="800" y="240" width="160" height="110" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
      <text x="815" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">MOODBOARD</text>
      <!-- Color Chips -->
      <circle cx="830" cy="295" r="14" fill="#ec4899" />
      <circle cx="865" cy="295" r="14" fill="#8b5cf6" />
      <circle cx="900" cy="295" r="14" fill="#06b6d4" />
      <circle cx="935" cy="295" r="14" fill="#10b981" />
      <rect x="815" y="325" width="130" height="6" rx="3" fill="#334155" />
    </g>

    <!-- Real-Time Multiplayer Cursor -->
    <g class="animated-cursor">
      <path d="M 0 0 L 0 18 L 4.5 14 L 9 22 L 12 20.5 L 7.5 13 L 14 13 Z" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
      <rect x="16" y="12" width="72" height="20" rx="4" fill="#ec4899" />
      <text x="22" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Alex (Live)</text>
    </g>
  </g>

  <!-- Foreground Main Title & Content (Completely Unobstructed) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 68)">
      <rect width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="15" cy="15" r="5" fill="#22c55e" />
      <text x="28" y="20" class="badge-text" fill="#c7d2fe">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="150" class="title-text">
      Digital Whiteboard <tspan fill="url(#primaryGrad)">&amp;</tspan>
    </text>
    <text x="0" y="205" class="title-text">
      Creative Tools 🎨
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="252" class="subtitle-text">
      Infinite Canvases • Visual Brainstorming • Hand-Drawn Sketching
    </text>
    <text x="0" y="278" class="subtitle-text" font-size="16" fill="#64748b">
      SaaS Industry Platforms &amp; Self-Hosted Open-Source Collaborative Workspaces
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="22" class="badge-text">⚡ Infinite Canvas</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="169" y="22" class="badge-text">🤝 Real-Time Sync</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="319" y="22" class="badge-text">🔒 Self-Hosted</text>

      <!-- Pill 4 -->
      <rect x="450" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="464" y="22" class="badge-text">🖊️ Stylus &amp; Touch</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
