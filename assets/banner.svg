px,120px)}75%{transform:translate(840px,240px)}}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate;transform-origin:1000px 300px}.floating-card-1{animation:floatCard1 6s ease-in-out infinite}.floating-card-2{animation:floatCard2 7s ease-in-out infinite}.floating-card-3{animation:floatCard3 5.5s ease-in-out infinite}.flow-line{stroke-dasharray:6,6;animation:dashFlow 2s linear infinite}.animated-cursor{animation:cursorMove 12s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="220" cy="110" r="140" fill="#6366f1" class="orb-1" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="280" r="160" fill="#ec4899" class="orb-2" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="380" r="100" fill="#06b6d4" filter="url(#glow)" opacity=".15"/><rect width="1200" height="420" fill="url(#dotGrid)" rx="16"/><g opacity=".9"><path fill="none" stroke="#818cf8" stroke-width="2.5" d="M 760 160 C 830 130, 870 190, 930 170" class="flow-line"/><path fill="none" stroke="#f472b6" stroke-width="2" d="M 870 230 C 920 270, 980 240, 1020 210" class="flow-line"/><g class="floating-card-1"><rect width="130" height="110" x="730" y="80" fill="#fef08a" filter="url(#softGlow)" opacity=".92" rx="8"/><rect width="70" height="8" x="745" y="100" fill="#ca8a04" opacity=".6" rx="4"/><rect width="95" height="6" x="745" y="118" fill="#ca8a04" opacity=".4" rx="3"/><rect width="80" height="6" x="745" y="132" fill="#ca8a04" opacity=".4" rx="3"/><circle cx="835" cy="95" r="4" fill="#eab308"/></g><g class="floating-card-2"><rect width="18