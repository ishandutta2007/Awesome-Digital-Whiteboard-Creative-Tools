eative Tools 🎨</text><text x="0" y="252" class="subtitle-text" transform="translate(60, 0)">Infinite Canvases • Visual Brainstorming • Hand-Drawn Sketching</text><text x="0" y="278" fill="#64748b" class="subtitle-text" font-size="16" transform="translate(60, 0)">SaaS Industry Platforms &amp; Self-Hosted Open-Source Collaborative Workspaces</text><g transform="translate(60, 0) translate(0, 315)"><rect width="145" height="34" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="14" y="22" class="badge-text">⚡ Infinite Canvas</text><rect width="140" height="34" x="155" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="169" y="22" class="badge-text">🤝 Real-Time Sync</text><rect width="135" height="34" x="305" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="319" y="22" class="badge-text">🔒 Self-Hosted</text><rect width="145" height="34" x="450" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="8"/><text x="464" y="22" class="badge-text">🖊️ Stylus &amp; Touch</text></g></g><rect width="1199" height="419" x=".5" y=".5" fill="none" stroke="#334155" stroke-width="1" opacity=".6" rx="15.5"/></svg>